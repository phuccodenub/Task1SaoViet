version: "3.8"

# ------------------------------------------------------------------
# Phase 3 — Observability overlay.
# Launch on top of the base stack:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Adds Prometheus (metrics scrape), Grafana (dashboards), and
# postgres-exporter (for content/omni tables to reach Prometheus).
# ------------------------------------------------------------------

networks:
  zalocrm_shared:
    external: true
    name: zalocrm_default

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: automation-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - zalocrm_shared

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: automation-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/zalocrm?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./monitoring/postgres-exporter-queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    networks:
      - zalocrm_shared

  grafana:
    image: grafana/grafana:11.2.2
    container_name: automation-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - zalocrm_shared

volumes:
  prometheus_data:
  grafana_data:
